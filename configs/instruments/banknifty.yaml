# BANKNIFTY instrument definition. See algo.services.live_seams.InstrumentConfig.
#
# ⚠️ CONFIRM every value against current exchange contract specs before any
# live run -- lot size, strike interval, and expiry cadence/weekday change
# periodically. Values below were read from the live Kite instrument dump
# (client.instruments("NFO")) on 2026-07-14 -- re-verify before trusting.
#
# BANKNIFTY no longer lists WEEKLY options (NSE discontinued them): only
# MONTHLY expiries exist, landing on the LAST TUESDAY of each month
# (e.g. 2026-07-28, 2026-08-25, 2026-09-29). Hence expiry_cadence: monthly.
exchange: NFO              # options trade on NFO
strike_interval: "100"
lot_size: 30
tick_size: "0.05"
spot_exchange: NSE         # underlying index spot lives on the NSE cash segment
spot_symbol: "NIFTY BANK"  # Kite's spot tradingsymbol for the index
expiry_cadence: monthly
expiry_weekday: 1          # 0=Mon..6=Sun; 1=Tuesday (last Tuesday of the month)
