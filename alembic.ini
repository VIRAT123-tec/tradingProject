# Alembic configuration for algo_platform.
#
# sqlalchemy.url is deliberately left blank below -- the real connection
# string is read from the DATABASE_URL environment variable by env.py, never
# hardcoded here, per the "no hardcoded secrets/credentials" requirement.
# This file is safe to commit; it contains no connection details.

[alembic]
# Migration scripts live inside the package, alongside the models they
# version -- matches the project's already-approved directory structure
# (src/algo/database/migrations/), not Alembic's own top-level default.
script_location = %(here)s/src/algo/database/migrations

# Needed so `from algo.database.models import Base` resolves in env.py even
# if the package has not been `pip install -e .`'d in the current environment.
prepend_sys_path = %(here)s/src

path_separator = os

# Left blank on purpose -- see the module docstring above and env.py, which
# sets this at runtime from DATABASE_URL.
sqlalchemy.url =


[post_write_hooks]
# No post-write hooks configured for this first pass (e.g. auto-formatting
# generated revision files with black/ruff) -- can be added later without
# affecting any already-written migration.


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
